
<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<title>ЛР 03 — сеанс</title>
<h1>Навчальний сеанс</h1>
<p id="state">Перевірка сеансу...</p>
<form id="register">
  <input name="userName" placeholder="Ім'я" required>
  <input name="email" type="email" placeholder="Email" required>
  <input name="displayName" placeholder="Профіль" required>
  <input name="password" type="password" placeholder="Пароль" autocomplete="new-password" required>
  <button>Зареєструватися</button>
</form>
<form id="login">
  <input name="userName" placeholder="Ім'я" autocomplete="username" required>
  <input name="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
  <button>Увійти</button>
</form>
<button id="me">Мій профіль</button><pre id="profile"></pre>
<form id="create">
  <input name="title" placeholder="Назва" required>
  <input name="description" placeholder="Опис" required>
  <select name="severity"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
  <input name="occurredAtUtc" type="datetime-local" required>
  <button>Створити інцидент</button>
</form>
<button id="logout">Вийти</button><pre id="result"></pre>
<script src="auth-lab.js" defer></script>
</html>
